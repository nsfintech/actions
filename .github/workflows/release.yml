# 本仓库(nsfintech/actions)自身的发布。
#
# 与 nsfintech/.github 的 release.yml 同模式:release-please(simple)开 release PR、
# 打 tag,发版后把 @v1 major tag 前移——消费方 uses: nsfintech/actions/actions/<name>@v1
# 自动跟进非破坏性更新。
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    uses: nsfintech/.github/.github/workflows/release-please.yml@v1
    with:
      release-type: simple
    secrets: inherit

  update-major-tag:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: [self-hosted, linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move @v1 major tag to ${{ needs.release-please.outputs.tag_name }}
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -e
          major="${TAG%%.*}"   # v1.1.0 -> v1
          echo "moving ${major} -> ${TAG}"
          git tag -f "$major" "$TAG"
          git push -f origin "$major"
