name: 'Setup Cross Tools'
description: |
  安装 Rust 交叉编译工具链:zig 0.15.2 + cargo-zigbuild + cargo-xwin(预编译二进制,
  sha256 校验,缓存到 $RUNNER_TOOL_CACHE)。装好后可在 linux runner 上交叉编译
  darwin(darwin-arm64/darwin-x64,经 zig)+ windows msvc(经 xwin)产物,
  消费方:cargo zigbuild / maturin --zig / napi build --cross-compile。

  设计说明:
  - 预编译二进制直接下载,不依赖 runner 上有 cargo/uv/npm(裸机可用)
  - 缓存目录 $RUNNER_TOOL_CACHE/cross-tools/<name>-<version>/:self-hosted runner
    该目录持久,第二次起秒级命中(与 setup-node 的 Found in cache 同机制)
  - zig 锁 0.15.2:0.16.x 的 darwin 链接有 bug(exported symbols list 参数被误读,
    报 FileNotFound,2026-09 实测)。升级前必须在 mac 上验证 darwin 双 target
  - 仅支持 x86_64 linux runner(组织 self-hosted runner 形态);加架构时补
    asset 名映射即可

  xwin 的 Windows SDK(~1.1GB)不在本 action 范围:首次 windows 构建时由
  cargo-xwin 自动下载到 ~/.cache/cargo-xwin/,DONE 标记持久跳过,天然自缓存。

inputs:
  zig-version:
    description: 'zig 版本(默认 0.15.2,锁版本原因见 action 说明)'
    required: false
    default: '0.15.2'
  zigbuild-version:
    description: 'cargo-zigbuild 版本(rust-cross/cargo-zigbuild release tag 去 v 前缀)'
    required: false
    default: '0.23.4'
  xwin-version:
    description: 'cargo-xwin 版本(rust-cross/cargo-xwin release tag 去 v 前缀)'
    required: false
    default: '0.23.1'

runs:
  using: 'composite'
  steps:
    - id: install
      shell: bash
      run: |
        set -euo pipefail

        zig_ver='${{ inputs.zig-version }}'
        zbuild_ver='${{ inputs.zigbuild-version }}'
        xwin_ver='${{ inputs.xwin-version }}'

        root="$RUNNER_TOOL_CACHE/cross-tools"
        mkdir -p "$root"

        fetch() { # fetch <url> <sha256> <file>
          local url="$1" want="$2" file="$3"
          curl -fsSL --retry 3 -o "$file" "$url"
          local got
          got="$(sha256sum "$file" | cut -d' ' -f1)"
          if [ "$got" != "$want" ]; then
            echo "::error::sha256 校验失败 $file: want=$want got=$got"
            exit 1
          fi
          echo "  下载完成: $(basename "$file") $(du -h "$file" | cut -f1)"
        }

        # ── zig ────────────────────────────────────────────────────────────
        # 从社区镜像 zig.linus.dev 下载(zig 官方推荐 CI 用镜像,官网单机托管无带宽
        # 保证,腾讯云实测 KB 级;镜像 200 实测)。文件完整性由 sha256(取自官方
        # index.json)保证,镜像内容不对比官方源直接 fail,不因镜像降低信任要求。
        # 解压后顶层目录 zig-x86_64-linux-<ver>/,二进制在其根。
        zig_dir="$root/zig-$zig_ver"
        if [ ! -x "$zig_dir/zig-x86_64-linux-$zig_ver/zig" ]; then
          echo "安装 zig $zig_ver"
          rm -rf "$zig_dir"
          fetch "https://zig.linus.dev/zig/$zig_ver/zig-x86_64-linux-$zig_ver.tar.xz" \
                "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239" \
                "$RUNNER_TEMP/zig.tar.xz"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$root"
          mv "$root/zig-x86_64-linux-$zig_ver" "$zig_dir"
        else
          echo "zig $zig_ver 缓存命中"
        fi
        echo "$zig_dir/zig-x86_64-linux-$zig_ver" >> "$GITHUB_PATH"

        # ── cargo-zigbuild ─────────────────────────────────────────────────
        # rust-cross release 预编译 musl 二进制,包内顶层目录与二进制同名。
        zbuild_dir="$root/cargo-zigbuild-$zbuild_ver"
        if [ ! -x "$zbuild_dir/cargo-zigbuild" ]; then
          echo "安装 cargo-zigbuild $zbuild_ver"
          rm -rf "$zbuild_dir"
          mkdir -p "$zbuild_dir"
          fetch "https://github.com/rust-cross/cargo-zigbuild/releases/download/v$zbuild_ver/cargo-zigbuild-x86_64-unknown-linux-musl.tar.xz" \
                "9e3cf73485edbd45905c8aadbc0fdf869c7ddc3848f0c898229f2680db52e44b" \
                "$RUNNER_TEMP/cargo-zigbuild.tar.xz"
          tar -xJf "$RUNNER_TEMP/cargo-zigbuild.tar.xz" -C "$zbuild_dir" --strip-components=1
        else
          echo "cargo-zigbuild $zbuild_ver 缓存命中"
        fi
        echo "$zbuild_dir" >> "$GITHUB_PATH"

        # ── cargo-xwin ─────────────────────────────────────────────────────
        # rust-cross release 预编译 musl 二进制,包是裸二进制(无顶层目录)。
        xwin_dir="$root/cargo-xwin-$xwin_ver"
        if [ ! -x "$xwin_dir/cargo-xwin" ]; then
          echo "安装 cargo-xwin $xwin_ver"
          rm -rf "$xwin_dir"
          mkdir -p "$xwin_dir"
          fetch "https://github.com/rust-cross/cargo-xwin/releases/download/v$xwin_ver/cargo-xwin-v$xwin_ver.x86_64-unknown-linux-musl.tar.gz" \
                "c492c6dfb7e5ac0eee586b796e0fc950ba13077e7f0bbb046f445d71790d5360" \
                "$RUNNER_TEMP/cargo-xwin.tar.gz"
          tar -xz -f "$RUNNER_TEMP/cargo-xwin.tar.gz" -C "$xwin_dir"
        else
          echo "cargo-xwin $xwin_ver 缓存命中"
        fi
        echo "$xwin_dir" >> "$GITHUB_PATH"
